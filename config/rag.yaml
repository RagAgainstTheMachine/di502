# Defaults for the selected, text-only E5 + BM25 pipeline.
# Secrets come from environment variables or the repository-root .env.
paths:
  processed: data/processed
chunking:
  size: 300  # tokens, including E5 prefix and special tokens
  overlap: 0
  generic_merge_peers: false
  ai_plan_merge_peers: true
models:
  embedding:
    name: intfloat/multilingual-e5-small
    dimensions: 384
    context_tokens: 512
  llm:  # Served by Ollama; the server address comes from the LLM_URL environment variable.
    name: qwen3:8b
    think: false  # qwen3 reasoning mode off: faster, and citations stay parseable
    temperature: 0
    context_tokens: 8192
    max_tokens: 500
    timeout_seconds: 280
qdrant:
  collection: ai_plan_text_only
retrieval:
  mode: hybrid
  top_k: 5
  candidates: 20
  expand_parent: false
  bm25:
    field: text
    tokenizer: word
    lowercase: true
prompt_variant: answer_v1  # prompts/answer_v1.txt
app:
  questions_per_chat: 5
  quote_chars: 450  # length of the source excerpt on a source card
